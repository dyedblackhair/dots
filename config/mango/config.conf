# More option see https://github.com/DreamMaoMao/mango/wiki/

# Dark-only theme integration for GTK / Qt applications.
env=GTK_THEME,Adwaita:dark
env=QT_QPA_PLATFORMTHEME,gtk3

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 10
blur_params_noise = 0.02
blur_params_brightness = 0.7
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=10
no_radius_when_single=0
focused_opacity=0.95
unfocused_opacity=0.85

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0
monocle_no_radius=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=40
repeat_delay=300
numlock_on=0
xkb_rules_layout=us,ru
xkb_rules_options=grp:alt_shift_toggle

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2

# Colors are generated from the current wallpaper by matugen (dark palette only).
# theme.conf is rewritten on every wallpaper change and watched by MangoWC.
source=./theme.conf

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# ============================================================================
# Key bindings — порт из dots-hyprland (end-4)
#
# Mango: bind[flags]=MODIFIERS,KEY,COMMAND,PARAMETERS
#   bindl — работает при заблокированном экране
#   bindp — передаёт клавишу приложению
# ============================================================================

# --- Система ----------------------------------------------------------------
bind=SUPER,r,reload_config
bind=SUPER,m,quit
bind=SUPER,q,killclient
bind=SUPER+SHIFT+ALT,q,killclient,force

# меню питания / блокировка / сон / выключение
bind=CTRL+ALT,Delete,spawn,@HOME@/.config/waybar/scripts/power-menu.sh
bindl=SUPER,l,spawn,swaylock -f -c 000000
bindl=SUPER+SHIFT,l,spawn,systemctl suspend
bindl=CTRL+SHIFT+ALT+SUPER,Delete,spawn,systemctl poweroff

# --- Меню и приложения ------------------------------------------------------
bind=ALT,space,spawn,rofi -show drun
bind=SUPER,Return,spawn,kitty
bind=SUPER,t,spawn,kitty
bind=CTRL+ALT,t,spawn,kitty
bind=SUPER,e,spawn,dolphin
bind=SUPER,w,spawn,librewolf
bind=SUPER,c,spawn,vscodium
bind=CTRL+SUPER,v,spawn,pavucontrol
bind=CTRL+SHIFT,Escape,spawn,kitty -e btop

# --- Буфер обмена -----------------------------------------------------------
bind=SUPER,v,spawn_shell,cliphist list | rofi -dmenu -i -p Clipboard | cliphist decode | wl-copy

# --- Waybar -----------------------------------------------------------------
bind=SUPER,j,spawn_shell,pkill -SIGUSR1 waybar

# --- Обои и тема ------------------------------------------------------------
bind=SUPER+SHIFT,w,spawn,@HOME@/.config/matugen/set-wallpaper.sh --pick
bind=CTRL+SUPER,t,spawn,@HOME@/.config/matugen/set-wallpaper.sh --pick
bind=CTRL+SUPER+ALT,t,spawn,@HOME@/.config/matugen/set-wallpaper.sh --random
bind=CTRL+SUPER,r,spawn_shell,pkill waybar; sleep 0.3; waybar >/dev/null 2>&1 &

# --- Скриншоты и утилиты ----------------------------------------------------
# Print — весь экран, Super+Shift+S — область (скрипт сохраняет файл и копирует в буфер)
bind=NONE,Print,spawn,@HOME@/.local/bin/screenshot full
bind=CTRL,Print,spawn,@HOME@/.local/bin/screenshot full
bind=SUPER+SHIFT,s,spawn,@HOME@/.local/bin/screenshot region
bind=SUPER+SHIFT,c,spawn,hyprpicker -a

# --- Медиа ------------------------------------------------------------------
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=ALT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
bindl=SUPER+SHIFT,n,spawn,playerctl next
bindl=SUPER+SHIFT,b,spawn,playerctl previous
bindl=SUPER+SHIFT,p,spawn,playerctl play-pause
bindl=SUPER+SHIFT,m,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bindl=SUPER+ALT,m,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

# --- Фокус и перемещение окон ----------------------------------------------
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,bracketleft,focusdir,left
bind=SUPER,bracketright,focusdir,right
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=ALT,Tab,focusstack,next

# Alt+F4 предупреждает, но всё равно передаёт клавишу приложению
bindp=ALT,F4,spawn_shell,notify-send "Wrong close keybind" "Super+Q to close. Use Alt+F4 for Windows VMs" -a Mango

# --- Состояния окна ---------------------------------------------------------
bind=SUPER+ALT,space,togglefloating
bind=SUPER,backslash,togglefloating
bind=SUPER,d,togglemaximizescreen
bind=ALT,a,togglemaximizescreen
bind=SUPER,f,togglefullscreen
bind=SUPER+ALT,f,togglefakefullscreen
bind=ALT+SHIFT,f,togglefakefullscreen
bind=SUPER,p,toggleglobal
bind=SUPER,g,toggleglobal
bind=SUPER,o,toggleoverlay
bind=SUPER,i,minimized
bind=SUPER+SHIFT,i,restore_minimized
bind=ALT+SHIFT,Return,dwindle_toggle_split_direction
bind=SUPER,semicolon,setmfact,-0.05
bind=SUPER,apostrophe,setmfact,+0.05
bind=CTRL+SUPER,backslash,resizewin,640,480

# --- Scratchpad -------------------------------------------------------------
bind=SUPER,s,toggle_special_tag
bind=CTRL+SUPER,s,toggle_special_tag
bind=SUPER+ALT,s,tag_special_silent
bind=ALT,z,toggle_scratchpad

# --- Теги / воркспейсы ------------------------------------------------------
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# отправить окно на тег без перехода (end-4: Super+Alt+1..0)
bind=SUPER+ALT,1,tagsilent,1
bind=SUPER+ALT,2,tagsilent,2
bind=SUPER+ALT,3,tagsilent,3
bind=SUPER+ALT,4,tagsilent,4
bind=SUPER+ALT,5,tagsilent,5
bind=SUPER+ALT,6,tagsilent,6
bind=SUPER+ALT,7,tagsilent,7
bind=SUPER+ALT,8,tagsilent,8
bind=SUPER+ALT,9,tagsilent,9

# отправить окно на тег и перейти (Mango extra)
bind=ALT,1,tag,1,0
bind=ALT,2,tag,2,0
bind=ALT,3,tag,3,0
bind=ALT,4,tag,4,0
bind=ALT,5,tag,5,0
bind=ALT,6,tag,6,0
bind=ALT,7,tag,7,0
bind=ALT,8,tag,8,0
bind=ALT,9,tag,9,0

# переключение тегов
bind=CTRL+SUPER,Left,viewtoleft
bind=CTRL+SUPER,Right,viewtoright
bind=SUPER,Page_Up,viewtoleft
bind=SUPER,Page_Down,viewtoright
bind=CTRL+SUPER,bracketleft,viewtoleft
bind=CTRL+SUPER,bracketright,viewtoright

# перенос окна на соседний тег
bind=SUPER+SHIFT,Page_Up,tagtoleft
bind=SUPER+SHIFT,Page_Down,tagtoright

# --- Мониторы ---------------------------------------------------------------
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# --- Зазоры -----------------------------------------------------------------
bind=ALT+SHIFT,x,incgaps,1
bind=ALT+SHIFT,z,incgaps,-1
bind=ALT+SHIFT,r,togglegaps

# --- Свободное перемещение / ресайз floating-окна ---------------------------
bind=CTRL+SHIFT,Left,movewin,-50,0
bind=CTRL+SHIFT,Right,movewin,50,0
bind=CTRL+SHIFT,Up,movewin,0,-50
bind=CTRL+SHIFT,Down,movewin,0,50
bind=CTRL+ALT,Left,resizewin,-50,0
bind=CTRL+ALT,Right,resizewin,50,0
bind=CTRL+ALT,Up,resizewin,0,-50
bind=CTRL+ALT,Down,resizewin,0,50

# --- Scroller layout (Mango extra) ------------------------------------------
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset
bind=ALT+SUPER+CTRL,Left,scroller_stack,left
bind=ALT+SUPER+CTRL,Right,scroller_stack,right
bind=ALT+SUPER+CTRL,Up,scroller_stack,up
bind=ALT+SUPER+CTRL,Down,scroller_stack,down

# --- Переключение layout (Mango extra) --------------------------------------
bind=SUPER,n,switch_layout

# --- Мышь -------------------------------------------------------------------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# --- Прокрутка --------------------------------------------------------------
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# --- Жесты ------------------------------------------------------------------
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# monitor
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1


exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=@HOME@/.config/matugen/set-wallpaper.sh --restore
exec_once=waybar
